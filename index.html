<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="color-scheme" content="dark light" />
    <script>
      ;(() => {
        try {
          const theme = localStorage.getItem('auren-theme') || 'dark'
          const isDark = theme === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : theme !== 'light'
          const savedPreset = localStorage.getItem('auren-appearance')
          const preset = ['black', 'graphite', 'slate'].includes(savedPreset) ? savedPreset : 'black'
          document.documentElement.dataset.appearance = preset
          const backgrounds = { black: ['#FAFAFA', '#09090B'], graphite: ['#EEEEEF', '#171719'], slate: ['#F4F7FB', '#0B1220'] }
          const background = backgrounds[preset][isDark ? 1 : 0]
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          document.documentElement.style.backgroundColor = background
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', background)
        } catch {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document.documentElement.style.backgroundColor = '#09090B'
        }
      })()
    </script>
    <!-- PWA: standalone + background_color; deliberately no apple-mobile-web-app-status-bar-style
         (black-translucent causes the iOS ~59px bottom chin-gap WebKit bug). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Auren" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Auren</title>
    <script type="importmap">
      {
        "imports": {
          "prochart": "/vendor/prochart/index.mjs"
        }
      }
    </script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
